# Keeps data/recipes.json — the offline copy of the recipes — up to date.
# See scripts/snapshot.py (what it fetches) and scripts/publish_snapshot.sh
# (how it commits safely when main moves during a run).

name: Recipe snapshot

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour when runners are busiest
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed snapshot
  pages: write      # ask Pages to rebuild with it

concurrency:
  group: recipe-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Refresh and publish snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish_snapshot.sh

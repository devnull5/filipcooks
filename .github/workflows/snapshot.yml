# Keeps data/recipes.json — the offline copy of the recipes — up to date.
# See scripts/snapshot.py for what it does and why.

name: Recipe snapshot

on:
  schedule:
    - cron: "17 * * * *"   # hourly, off the top of the hour when runners are busiest
  workflow_dispatch:

permissions:
  contents: write   # commit the refreshed snapshot
  pages: write      # ask Pages to rebuild with it

concurrency:
  group: recipe-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch published recipes
        run: python3 scripts/snapshot.py

      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/recipes.json; then
            echo "Snapshot unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git commit -m "Refresh recipe snapshot"
          git push
          # Pushes made with the workflow token may not trigger a Pages build
          # on their own, so request one explicitly. Harmless if redundant.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed; the next push will rebuild."

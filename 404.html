<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found | Filip Cooks</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍳</text></svg>">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script>
    // A new recipe's /recipes/<slug>/ page is built by the hourly snapshot job.
    // Until then, hand it to the page that renders any recipe from the database.
    (function () {
      var m = location.pathname.match(/^\/recipes\/([a-z0-9]+(?:-[a-z0-9]+)*)\/?$/);
      if (m) location.replace('/recipe.html?r=' + m[1] + location.search.replace(/^\?/, '&') + location.hash);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/"><span class="brand-mark">🍳</span> Filip Cooks</a>
    </div>
  </header>

  <main class="wrap">
    <div class="gate">
      <div class="empty-icon">🍂</div>
      <h1>Nothing on this page</h1>
      <p>That link doesn't lead anywhere. The recipes are all this way:</p>
      <a class="btn" href="/">Browse recipes</a>
    </div>
  </main>
</body>
</html>
